  <noscript><style>.atlas-layout{display:none}body{overflow:auto}.site-header{position:static}</style><main class="fallback-book"><h1>青甘银川 · 沿途记录</h1><article id="record-chengdu"><p>9.24 / 10.5</p><h2>成都</h2><p>9 月 24 日从成都出发，前往银川。</p><p>回程从西宁连夜驱车，10 月 5 日清晨 7 点左右到家。</p></article><article id="record-helan"><p>9.25</p><h2>贺兰山宿集</h2><p>24 日从成都出发，次日抵达银川。进城后的第一餐选在一家当地非遗餐厅，手抓羊肉令人惊艳。</p><p>下午入住贺兰山宿集，最喜欢那里的房舍与庭院。在房间休息之余，我拿着相机拍下酒店的样子，晚上再到餐厅用餐。</p><p>那时旅程刚开始，住进喜欢的院子，人也正是最有精神的时候。</p></article><article id="record-jiuhe"><p>9.26</p><h2>贺兰山下 · 九贺</h2><p>这一天在贺兰山下散步闲逛，晚上入住九贺酒店。</p></article><article id="record-wuwei"><p>9.27 · 途经</p><h2>武威</h2><p>离开银川，途经武威，穿过沙漠与戈壁，前往张掖。</p></article><article id="record-zhangye"><p>9.27—9.28</p><h2>张掖 · 市区</h2><p>27 日经武威抵达张掖。</p><p>第二天从平山湖大峡谷回到市区，已是下午 4 点。用餐后继续赶往七彩丹霞。</p></article><article id="record-pingshanhu"><p>9.28 · 11:00</p><h2>张掖 · 平山湖大峡谷</h2><p>上午 10 点从张掖出发，11 点抵达平山湖大峡谷。直到下午 4 点，才回到张掖市区。</p></article><article id="record-danxia"><p>9.28 · 18:30</p><h2>张掖 · 七彩丹霞</h2><p>从峡谷回到张掖市区，吃过饭便赶往七彩丹霞。傍晚 6 点半，正好赶到 4 号观景台。</p><p>离开丹霞后，连夜驱车前往敦煌。</p></article><article id="record-dunhuang"><p>9.28 夜—9.30</p><h2>敦煌</h2><p>离开张掖后，没有在原定的嘉峪关停车场过夜，而是继续驱车前往敦煌。抵达时已很晚，在一家 46 元的小酒店住了一夜。</p><p>29 日在城里散步，去了敦煌四局和沙州夜市。原计划的雅丹魔鬼城，这次没有成行。</p></article><article id="record-nightmarket"><p>9.29</p><h2>敦煌 · 沙州夜市</h2><p>9 月 29 日，在敦煌市内逛到了沙州夜市。</p></article><article id="record-siju"><p>9.29</p><h2>敦煌四局</h2><p>9 月 29 日，在敦煌城里散步，去了敦煌四局。</p></article><article id="record-mingsha"><p>9.30 · 至 20:00</p><h2>敦煌 · 鸣沙山</h2><p>在鸣沙山旅拍，一直待到晚上 8 点左右才返回。</p></article><article id="record-lenghu"><p>10.1</p><h2>冷湖</h2><p>离开敦煌，先到冷湖，再继续前往石油遗址、黑独山和火星营地。</p></article><article id="record-oil-town"><p>10.1</p><h2>冷湖 · 石油遗址</h2><p>经过冷湖后，到冷湖废弃石油小镇遗址停留，再继续前往黑独山。</p></article><article id="record-heidu"><p>10.1</p><h2>冷湖 · 黑独山</h2><p>这一天从冷湖、石油遗址一路走来，去了黑独山，之后继续前往火星营地。</p></article><article id="record-mars"><p>10.1 · 门口</p><h2>冷湖 · 火星营地</h2><p>火星营地没有入内，只在门口停留。随后继续赶往水上雅丹。</p></article><article id="record-water"><p>10.1—10.2</p><h2>水上雅丹</h2><p>从敦煌出发，经过冷湖、石油遗址、黑独山和火星营地，这一天最后抵达水上雅丹，入住孤独星际酒店。</p><p>第二天上午游览水上雅丹，下午再前往察尔汗盐湖。</p></article><article id="record-chaerhan"><p>10.2 · 下午</p><h2>察尔汗盐湖</h2><p>上午游览水上雅丹，下午前往察尔汗盐湖。途中经过几处湖泊和 U 型公路，傍晚看到了美丽的日落，当晚住在德令哈。</p></article><article id="record-delingha"><p>10.2 夜—10.3</p><h2>德令哈</h2><p>从盐湖与公路上看过日落，晚上在德令哈住下。</p><p>连日看过许多景色，渐渐有些审美疲劳。第二天省去德令哈周边的游览，直接前往青海湖。</p></article><article id="record-lake"><p>10.3—10.4</p><h2>青海湖</h2><p>从德令哈直接前往青海湖。下午在湖边看景，傍晚到附近的垭口看日落。</p><p>夜里 11 点多，又到附近拍照，把湖边的星空收进了镜头。</p><p>第二天沿湖绕行，前往观星营地，再去西宁。</p></article><article id="record-camp"><p>10.4</p><h2>观星营地</h2><p>从青海湖沿湖绕行，到了观星营地，之后继续前往西宁。</p></article><article id="record-xining"><p>10.4</p><h2>西宁</h2><p>离开青海湖，到西宁参观藏文化博物馆。还喝了一杯咖啡，味道不太合意。</p><p>随后连夜驱车返程，次日清晨 7 点左右到家。</p></article></main></noscript>
